<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMS 2026 Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="bg-white border-b px-4 py-3 sticky top-0 z-30 flex justify-between items-center shadow-sm">
        <h1 class="font-black text-blue-700 text-lg">PMS 2026</h1>
        <button onclick="openModal('add-room')" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
            <i class="fa fa-plus"></i>
        </button>
    </header>

    <main class="p-4 pb-24">
        <div id="view-dashboard" class="space-y-4">
            <div class="flex justify-between items-end">
                <h2 class="font-bold text-slate-800 tracking-tight">Sơ đồ phòng</h2>
                <div id="expiryWarning" class="hidden text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded-full font-bold uppercase tracking-tighter">HĐ sắp hết hạn</div>
            </div>
            <div id="roomGrid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div id="view-tenants" class="hidden space-y-4">
    <div class="flex justify-between items-center px-1">
        <h2 class="font-black text-slate-800 italic uppercase">Lịch sử hóa đơn</h2>
    </div>

    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
        <input type="text" id="searchBill" oninput="filterBills()" placeholder="Tìm tên khách, số phòng..." 
            class="w-full p-4 bg-slate-50 rounded-2xl border-none text-xs font-bold outline-none">
        
        <div class="grid grid-cols-3 gap-2">
            <button onclick="setQuickFilter('thisMonth')" class="py-2 bg-blue-50 text-blue-600 rounded-xl text-[10px] font-black uppercase">Tháng này</button>
            <button onclick="setQuickFilter('lastMonth')" class="py-2 bg-slate-50 text-slate-500 rounded-xl text-[10px] font-black uppercase">Tháng trước</button>
            <button onclick="setQuickFilter('all')" class="py-2 bg-slate-50 text-slate-500 rounded-xl text-[10px] font-black uppercase">Tất cả</button>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <div class="space-y-1">
                <label class="text-[8px] font-black text-slate-400 uppercase ml-2 italic">Từ ngày</label>
                <input type="date" id="filterFromDate" onchange="filterBills()" class="w-full p-3 bg-slate-50 rounded-xl border-none text-[10px] font-bold outline-none">
            </div>
            <div class="space-y-1">
                <label class="text-[8px] font-black text-slate-400 uppercase ml-2 italic">Đến ngày</label>
                <input type="date" id="filterToDate" onchange="filterBills()" class="w-full p-3 bg-slate-50 rounded-xl border-none text-[10px] font-bold outline-none">
            </div>
        </div>
    </div>

    <div id="tenantList" class="space-y-3"></div>
</div>

        <div id="view-finance" class="hidden space-y-4">
            <h2 class="font-bold text-slate-800 tracking-tight">Chốt sổ hàng tháng</h2>
            <div class="bg-blue-600 p-4 rounded-2xl text-white shadow-lg mb-6">
                <p class="text-[10px] opacity-80 uppercase font-bold">Tổng doanh thu tháng này</p>
                <h3 id="totalRevenue" class="text-2xl font-black italic">0đ</h3>
            </div>
            <div id="unpaidList" class="space-y-3">
                </div>
        </div>

        <div id="view-settings" class="hidden space-y-4">
    <div class="flex justify-between items-center px-1">
        <h2 class="font-black text-slate-800 italic uppercase text-lg">Cấu hình chi phí</h2>
        <button onclick="openConfigModal()" class="bg-blue-600 text-white px-4 py-2 rounded-2xl font-bold text-[10px] uppercase shadow-lg active:scale-90 transition-all">
            + Thêm loại phí
        </button>
    </div>

    <div id="configContainer" class="grid grid-cols-2 gap-3">
        </div>
    
    <div class="p-4 bg-slate-900 rounded-3xl shadow-2xl mt-4">
        <p class="text-[9px] text-slate-400 font-bold uppercase italic text-center mb-3">Chỉnh sửa giá trực tiếp trên thẻ và lưu</p>
        <button onclick="saveSettings()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg active:scale-95 transition-all">
            Xác nhận lưu thay đổi
        </button>
    </div>
</div>

<div id="view-tenants" class="hidden space-y-4">
    <div class="flex justify-between items-center">
        <h2 class="font-black text-slate-800 italic uppercase">Lịch sử hóa đơn</h2>
    </div>

    <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
        <input type="text" id="searchBill" oninput="filterBills()" placeholder="Tìm tên khách, số phòng..." 
            class="w-full p-3 bg-slate-50 rounded-xl border-none text-xs font-bold outline-none">
        <div class="grid grid-cols-2 gap-2">
            <select id="filterMonth" onchange="filterBills()" class="p-2 bg-slate-50 rounded-xl border-none text-[10px] font-bold outline-none">
                <option value="">Tất cả tháng</option>
                ${[...Array(12).keys()].map(i => `<option value="${i+1}">Tháng ${i+1}</option>`).join('')}
            </select>
            <select id="filterStatus" onchange="filterBills()" class="p-2 bg-slate-50 rounded-xl border-none text-[10px] font-bold outline-none">
                <option value="">Tất cả trạng thái</option>
                <option value="paid">Đã thanh toán</option>
                <option value="unpaid">Chưa thu</option>
            </select>
        </div>
    </div>

    <div id="tenantList" class="space-y-3"></div>
</div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t flex justify-around items-center py-2 safe-area-bottom z-40 shadow-2xl">
        <button onclick="switchTab('dashboard')" class="nav-link flex flex-col items-center gap-1 text-blue-600">
            <i class="fa fa-home text-lg"></i><span class="text-[9px] font-black uppercase">Sơ đồ</span>
        </button>
        <button onclick="switchTab('finance')" class="nav-link flex flex-col items-center gap-1 text-slate-400">
            <i class="fa fa-file-invoice-dollar text-lg"></i><span class="text-[9px] font-black uppercase">Chốt sổ</span>
        </button>
        <button onclick="switchTab('tenants')" class="nav-link flex flex-col items-center gap-1 text-slate-400">
    <i class="fa fa-file-invoice text-lg"></i>
    <span class="text-[9px] font-black uppercase">Hóa đơn</span>
</button>
        <button onclick="switchTab('settings')" class="nav-link flex flex-col items-center gap-1 text-slate-400">
            <i class="fa fa-cog text-lg"></i><span class="text-[9px] font-black uppercase">Cài đặt</span>
        </button>
    </nav>

    <div id="mainModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transition-transform transform translate-y-0 overflow-y-auto max-h-[90vh]">
            <div id="modalContent"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
